name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentworkbench:ci .
      - name: Start container and check health
        run: |
          docker run -d --name awb -p 8000:8000 agentworkbench:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -sS -o /dev/null -w "root redirects to setup: %{http_code} %{redirect_url}\n" http://127.0.0.1:8000/
          docker logs awb
      - name: Data survives a restart
        run: |
          docker exec awb python -c "import settings; settings.put('site_title','CI')"
          docker restart awb
          sleep 4
          docker exec awb python -c "import settings; assert settings.get('site_title') == 'CI'"
