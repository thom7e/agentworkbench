{% extends "admin_base.html" %}
{% block admin %}
<form class="fgrid" method="post" action="/admin/settings">
<label>{{ t('set.title') }}<input name="site_title" value="{{ s.site_title }}" required></label>
<label>{{ t('set.language') }}<select name="language"><option value="de"{% if s.language == 'de' %} selected{% endif %}>Deutsch</option><option value="en"{% if s.language == 'en' %} selected{% endif %}>English</option></select></label>
<label>{{ t('set.areas') }}<textarea name="areas" rows="5">{{ areas }}</textarea><small>{{ t('set.areas.help') }}</small></label>
<label>{{ t('set.dormant') }}<input type="number" name="dormant_days" min="1" value="{{ s.dormant_days }}"><small>{{ t('set.dormant.help') }}</small></label>
<label>{{ t('set.sort') }}<select name="default_sort"><option value="aktuell"{% if s.default_sort != 'offen' %} selected{% endif %}>{{ t('set.sort.recent') }}</option><option value="offen"{% if s.default_sort == 'offen' %} selected{% endif %}>{{ t('set.sort.open') }}</option></select></label>
<label>{{ t('set.gh.owner') }}<input name="github_owner" value="{{ s.github_owner }}" autocomplete="off"></label>
<label>{{ t('set.gh.token') }}<input type="password" name="github_token" placeholder="{{ '********' if has_token }}" autocomplete="new-password"><small>{{ t('set.gh.token.help') }}</small></label>
<label>{{ t('set.vault') }}<input name="obsidian_vault" value="{{ s.obsidian_vault }}"><small>{{ t('set.vault.help') }}</small></label>
<div><button class="go">{{ t('save') }}</button></div>
</form>
{% endblock %}
