<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1b19">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AgentWorkbench">
<link rel="manifest" href="/static/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>{% block title %}{{ site_title() }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap">
{% block body %}{% endblock %}
<script>
(function(){
  var key='scroll:'+location.pathname;
  window.keepScroll=function(){
    try{sessionStorage.setItem(key,JSON.stringify({y:window.scrollY,d:Array.from(document.querySelectorAll('.drop')).map(function(e){return e.scrollTop})}))}catch(e){}
  };
  try{
    var s=JSON.parse(sessionStorage.getItem(key)||'null');
    if(s){sessionStorage.removeItem(key);window.scrollTo(0,s.y);
      document.querySelectorAll('.drop').forEach(function(e,i){e.scrollTop=s.d[i]||0})}
  }catch(e){}
  document.addEventListener('click',function(e){var a=e.target.closest('a[data-keep]');if(a)window.keepScroll()});
  document.addEventListener('submit',function(e){
    var n=e.target.querySelector('input[name=next]');
    if(n)n.value=location.pathname+location.search;
    window.keepScroll();
  });
})();
</script>
</div></body></html>
