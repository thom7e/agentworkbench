{% extends "base.html" %}
{% block title %}{{ t('login.title') }}{% endblock %}
{% block body %}
<div class="hello narrow"><h1>{{ site_title() }}</h1>
{% if error %}<p class="notice err">{{ t(error) }}</p>{% endif %}
<form class="fgrid" method="post" action="/login">
<input type="hidden" name="next" value="{{ next }}" data-fixed>
<label>{{ t('password') }}<input type="password" name="password" required autofocus autocomplete="current-password"></label>
<div><button class="go">{{ t('login.submit') }}</button></div></form>
<div id="pk-box" hidden><p class="hint2">{{ t('login.or') }}</p><button type="button" class="go" id="pk-login">{{ t('login.passkey') }}</button><p class="notice err" id="pk-err" hidden>{{ t('login.passkey.fail') }}</p></div></div>
<script src="/static/passkey.js"></script>
<script>if(window.PublicKeyCredential){document.getElementById('pk-box').hidden=false;document.getElementById('pk-login').onclick=function(){window.awbPasskey.login(document.querySelector('input[name=next]').value).catch(function(e){window.awbPasskey.show(document.getElementById('pk-err'),e)})}}</script>
{% endblock %}
