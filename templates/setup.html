{% extends "base.html" %}
{% block title %}{{ t('setup.title') }}{% endblock %}
{% block body %}
<div class="hello narrow"><h1>{{ site_title() }}</h1><p>{{ t('setup.intro') }}</p>
{% if error %}<p class="notice err">{{ t(error) }}</p>{% endif %}
<form class="fgrid" method="post" action="/setup">
<label>{{ t('password') }}<input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
<label>{{ t('password.repeat') }}<input type="password" name="repeat" minlength="10" required autocomplete="new-password"></label>
<div><button class="go">{{ t('setup.save') }}</button></div></form></div>
{% endblock %}
